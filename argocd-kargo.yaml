apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/asd99557/kargo-poc.git
    targetRevision: main
    path: kargo-config

  destination:
    server: https://kubernetes.default.svc
    namespace: kargo-poc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
