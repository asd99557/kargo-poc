apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-poc

spec:
  requestedFreight:

    - origin:
        kind: Warehouse
        name: myapp
      sources:
        direct: true
        autoPromotionOptions:
          selectionPolicy: NewestFreight
  promotionTemplate:
    spec:
      steps:
        - task:
            name: myapp-promotion
          as: promotion
