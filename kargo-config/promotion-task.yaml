apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask

metadata:
  name: myapp-promotion
  namespace: kargo-poc

spec:
  vars:
    - name: gitopsRepo
      value: https://github.com/asd99557/kargo-poc.git

  steps:

    # 1. Checkout the EXACT Git commit contained in the Freight
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        checkout:
          - commit: ${{ commitFrom(vars.gitopsRepo).ID }}
            path: ./src

          - branch: stage/${{ ctx.stage }}
            create: true
            path: ./out

    # 2. Clear the existing environment branch
    - uses: git-clear
      config:
        path: ./out

    # 3. Build manifests WITHOUT changing the image version
    - uses: kustomize-build
      config:
        path: ./src/stages/${{ ctx.stage }}
        outPath: ./out

    # 4. Commit the Git version exactly as it exists in the Freight
    - uses: git-commit
      as: commit
      config:
        path: ./out
        message: "Promote Git commit ${{ commitFrom(vars.gitopsRepo).ID }} to ${{ ctx.stage }}"

    # 5. Push environment branch
    - uses: git-push
      config:
        path: ./out

    # 6. Tell Argo CD to deploy the generated commit
    - uses: argocd-update
      config:
        apps:
          - name: myapp-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}