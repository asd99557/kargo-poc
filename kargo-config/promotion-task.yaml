apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: myapp-promotion
  namespace: kargo-poc

spec:
  vars:
    - name: gitopsRepo
      value: https://github.com/asd99557/kargo-poc.git

    - name: imageRepo
      value: docker.io/library/nginx

  steps:

    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        checkout:

          - branch: main
            path: ./src

          - branch: stage/${{ ctx.stage }}
            create: true
            path: ./out

    - uses: git-clear
      config:
        path: ./out

    - uses: kustomize-set-image
      as: update
      config:
        path: ./src/base
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}

    - uses: kustomize-build
      config:
        path: ./src/stages/${{ ctx.stage }}
        outPath: ./out

    - uses: git-commit
      as: commit
      config:
        path: ./out
        message: ${{ task.outputs.update.commitMessage }}

    - uses: git-push
      config:
        path: ./out

    - uses: argocd-update
      config:
        apps:
          - name: myapp-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
