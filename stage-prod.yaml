apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-poc

spec:
  requestedFreight:

    - origin:
        kind: Warehouse
        name: myapp

      sources:
        stages:
          - qa

  promotionTemplate:
    spec:
      steps:
        - task:
            name: myapp-promotion
          as: promotion
